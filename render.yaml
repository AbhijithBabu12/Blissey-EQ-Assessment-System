services:
  - type: web
    name: blissey-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ
        sync: false
      - key: GROQ2
        sync: false
